[pytest]
# Async mode for pytest-asyncio
asyncio_mode = auto

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Paths
testpaths =
    tests
    app/services/draft_pipeline/tests
    app/services/draft_pipeline/phases/tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers
# - asyncio     : async test (handled by pytest-asyncio, auto mode)
# - slow        : tests that take >5s; excluded from default local runs
#                 via ``pytest -m "not slow"``
# - integration : hits a real external service (LLM, paper API). Skipped
#                 automatically when the relevant env var is not set.
#                 See ``backend/tests/integration/test_real_llm.py`` for
#                 the canonical pattern. Run locally with::
#                     export INTEGRATION_LLM_KEY=sk-...
#                     pytest -m integration
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test (skipped without INTEGRATION_LLM_KEY)

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
