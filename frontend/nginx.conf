# CiteThreads frontend — nginx config for the production image.
#
# - Serves the Vite-built SPA from /usr/share/nginx/html.
# - SPA fallback: unknown paths return index.html so the React Router
#   takes over.
# - Long-lived caching for hashed assets (``/assets/*``), no caching
#   for the entry HTML so a deploy invalidates clients immediately.
# - /api is reverse-proxied to the backend container. The compose
#   file wires `backend` to that service name, but operators can
#   override with the BACKEND_URL env var baked at build time (see
#   Dockerfile comments).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text responses — Vite output is mostly JSON, JS, CSS, HTML.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # /api -> backend. `proxy_pass http://backend:8000;` is the
    # standard compose DNS name. For non-compose deployments, build
    # the image with `--build-arg BACKEND_URL=...` and update the
    # location block to use that variable (kept simple here so the
    # default image runs against a compose-deployed backend).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM phase endpoints can run for 60s+ — give the proxy
        # headroom so the browser doesn't time out first.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed Vite assets — cache forever (filename changes on rebuild).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any non-asset path that
    # doesn't match a real file. Lets React Router own the URL.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
