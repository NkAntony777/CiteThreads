# CiteThreads full-stack — project-root compose file.
#
# Brings up the backend and frontend together. The frontend's nginx
# proxies /api to the backend over the compose network, so the
# browser talks to a single origin and CORS is a non-issue.
#
# Run:  docker compose up --build
# Stop: docker compose down

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: citethreads-backend:dev
    container_name: citethreads-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: ./.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app/data
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: citethreads-frontend:dev
    container_name: citethreads-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      # The nginx config uses the compose service name `backend`
      # directly, so this is a hint for humans reading logs.
      BACKEND_URL: http://backend:8000
